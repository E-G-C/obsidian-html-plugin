<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Dummy iframe srcdoc example</title>
		<style>
			:root {
				color: #172033;
				background: #f4f6f9;
				font-family: Arial, Helvetica, sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
			}

			.site-header {
				background: #ffffff;
				border-bottom: 1px solid #d9dee8;
			}

			.brand,
			.page {
				margin: 0 auto;
				max-width: 1080px;
				padding-left: 24px;
				padding-right: 24px;
			}

			.brand {
				font-size: 1.25rem;
				font-weight: 700;
				padding-bottom: 18px;
				padding-top: 18px;
			}

			nav {
				border-top: 1px solid #eef0f4;
				padding: 12px 24px;
			}

			nav span {
				display: inline-block;
				margin-right: 22px;
			}

			.page {
				padding-bottom: 32px;
				padding-top: 24px;
			}

			.content-frame {
				background: #ffffff;
				border: 1px solid #b9c2d0;
				display: block;
				height: 720px;
				width: 100%;
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<div class="brand">Dummy Site</div>
			<nav aria-label="Example navigation">
				<span>Alpha</span>
				<span>Beta</span>
				<span>Gamma</span>
				<span>Delta</span>
			</nav>
		</header>

		<main class="page">
			<h1>Outer Dummy Document</h1>
			<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>

			<iframe
				class="content-frame"
				id="dummy-document"
				name="dummy-document"
				src
				title="Embedded dummy document"
				frameborder="0"
				scrolling="auto"
				allowfullscreen
				data-default-height="720"
				style="height: 720px; overflow-y: hidden;"
				sandbox="allow-forms allow-modals allow-popups allow-scripts"
				srcdoc="<!doctype html>
					<html lang=&quot;en&quot;>
						<head>
							<meta charset=&quot;utf-8&quot;>
							<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;>
							<style>
								* { box-sizing: border-box; }
								body {
									background: #fff;
									color: #273043;
									font-family: Arial, Helvetica, sans-serif;
									line-height: 1.55;
									margin: 0;
								}
								.hero {
									background: linear-gradient(135deg, #e6ecf5, #c9d6e8);
									border: 3px solid #273c75;
									margin: 32px auto 24px;
									max-width: 760px;
									padding: 44px 32px;
									text-align: center;
								}
								.hero span {
									display: block;
									font-size: 0.9rem;
									letter-spacing: 0.18em;
									margin-bottom: 8px;
								}
								.hero h1 {
									font-size: 2rem;
									letter-spacing: 0.08em;
									margin: 0;
								}
								main {
									margin: 0 auto;
									max-width: 760px;
									padding: 0 24px 40px;
								}
								h2 {
									color: #294d85;
									margin-top: 32px;
								}
								.notice {
									background: #edf7f0;
									border-left: 4px solid #2f7d4a;
									padding: 12px 16px;
								}
							</style>
						</head>
						<body>
							<header class=&quot;hero&quot;>
								<span>DUMMY BANNER</span>
								<h1>EMBEDDED CONTENT</h1>
							</header>
							<main>
								<p class=&quot;notice&quot;>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
								<h2>Dummy Heading One</h2>
								<p>Praesent commodo cursus magna, vel scelerisque nisl consectetur et.</p>
								<ol>
									<li>Dummy list item one.</li>
									<li>Dummy list item two.</li>
									<li>Dummy list item three.</li>
								</ol>
								<h2>Dummy Heading Two</h2>
								<ul>
									<li>Placeholder alpha.</li>
									<li>Placeholder beta.</li>
									<li>Placeholder gamma.</li>
								</ul>
							</main>
						</body>
					</html>"
			></iframe>
		</main>
	</body>
</html>
